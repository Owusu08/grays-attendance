<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lecturer Login · Gray's Attendance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%234F46E5%27/%3E%3Ctext x=%2716%27 y=%2722.5%27 font-family=%27Arial%27 font-weight=%27800%27 font-size=%2719%27 text-anchor=%27middle%27 fill=%27white%27%3EG%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/modern.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#4F46E5">
<script>(function(){try{document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'light');}catch(e){}})();</script>
</head>
<body class="auth">
<div class="wrap">
<div class="brand-hero"><div class="brand-mark">G</div><div class="brand-name">Gray's Attendance</div></div>
<div class="card auth-card">
<div class="role-chip green">Lecturer</div>
<h1>Welcome back</h1>
<p class="card-sub">Sign in to run your class sessions.</p>
<form id="form" novalidate>
<div class="field"><label for="email">Email</label><input type="email" id="email" autocomplete="email" placeholder="you@school.edu.gh" required></div><div class="field"><label for="password">Password</label><div class="password-wrapper"><input type="password" id="password" autocomplete="current-password" placeholder="Your password" required><button type="button" class="toggle-password" data-target="password">Show</button></div></div>
<div class="err" id="err"></div>
<button class="btn btn-block" type="submit" style="margin-top:20px;">Log in</button>
</form>
<div class="auth-foot">New lecturer? <a href="register.html" class="btn-link">Join with a lecturer code</a></div>
<div class="portal-switch"><span>Not a lecturer?</span><a href="admin-login.html">Administrator sign in</a><a href="institution-login.html">Institution sign in</a></div>
</div>
</div>
<script src="/js/common.js"></script>
<script>
setupAuth({role:'lecturer',home:'dashboard.html',url:'/api/auth/login',label:'Log in',busy:'Logging in...',fail:'Login failed.',
build:function(){var e=val('email'),p=document.getElementById('password').value;if(!e||!p)throw new Error('Enter your email and password.');return {email:e,password:p};}});
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){});});}
</script>
</body>
</html>
